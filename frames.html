<style>
  :root{
    --bg:#0a0a0f;--bg-2:#12121a;--bg-card:rgba(22,22,30,0.55);
    --fg:#f5f2e8;--fg-dim:rgba(245,242,232,0.66);--fg-dimmer:rgba(245,242,232,0.42);
    --pink:#ec4899;--pink-2:#f472b6;--pink-soft:rgba(236,72,153,0.14);--pink-line:rgba(236,72,153,0.34);
    --cream:#faf6eb;--gold:#d4af7a;--green:#7dd3a0;--yellow:#fbbf24;
    --border:rgba(255,255,255,0.07);--border-strong:rgba(255,255,255,0.13);
    --font-display:'Fraunces',Georgia,serif;
    --font-body:'Instrument Sans',system-ui,-apple-system,sans-serif;
    --font-mono:'JetBrains Mono','Cascadia Code','Consolas',monospace;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{overflow-x:clip;color-scheme:dark}
  body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--fg);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(236,72,153,0.08),transparent 70%),radial-gradient(ellipse 60% 40% at 85% 20%,rgba(212,175,122,0.05),transparent 70%);pointer-events:none;z-index:0}
  body>*{position:relative;z-index:1}
  ::selection{background:var(--pink);color:#0a0a0f}
  a{color:var(--pink);text-decoration:none;border-bottom:1px solid rgba(236,72,153,0.3)}
  a:hover{color:var(--pink-2);border-bottom-color:var(--pink-2)}
  h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:-0.02em;line-height:1.05;margin:0}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--pink-2);outline-offset:2px}

  .top{max-width:1320px;margin:0 auto;padding:22px 24px 0;display:flex;justify-content:space-between;align-items:center;gap:16px}
  .brand{font-family:var(--font-display);font-size:1rem;font-weight:800;letter-spacing:0.22em;color:var(--gold);text-transform:uppercase;border:0}
  .brand:hover{color:var(--cream)}
  .lang-toggle{display:flex;border:1px solid var(--border-strong);border-radius:2px;overflow:hidden;background:rgba(0,0,0,0.4)}
  .lang-btn{padding:6px 14px;border:none;background:transparent;color:var(--fg-dimmer);font-size:0.72rem;font-weight:700;letter-spacing:0.18em;cursor:pointer}
  .lang-btn[aria-pressed="true"]{background:var(--pink);color:#0a0a0f}
  .lang-btn:hover:not([aria-pressed="true"]){color:var(--fg)}

  .wrap{max-width:1320px;margin:0 auto;padding:36px 24px 80px}
  .title{font-size:clamp(2.6rem,7vw,5.2rem);letter-spacing:-0.04em;line-height:0.95;font-variation-settings:"opsz" 144}
  .title i{font-style:italic;color:var(--pink);font-weight:400;margin-left:.14em}
  .lede{font-family:var(--font-display);font-style:italic;font-size:clamp(1.02rem,1.8vw,1.25rem);color:var(--fg-dim);max-width:62ch;margin:18px 0 0;line-height:1.5}

  .layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,440px);gap:36px;margin-top:44px;align-items:start}
  .step-h{font-size:1.55rem;color:var(--cream);display:flex;align-items:baseline;gap:12px}
  .step-h .n{font-family:var(--font-mono);font-size:0.8rem;font-weight:500;color:var(--pink);letter-spacing:0.08em}

  .pick-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .seg{display:flex;align-items:center;gap:10px;font-size:0.8rem;color:var(--fg-dimmer)}
  .seg-btns{display:flex;border:1px solid var(--border-strong);border-radius:2px;overflow:hidden}
  .seg-btns button{padding:6px 12px;border:0;background:transparent;color:var(--fg-dim);cursor:pointer;font-size:0.8rem}
  .seg-btns button[aria-pressed="true"]{background:var(--fg);color:#0a0a0f}
  .pick{min-width:0}
  .cats{position:sticky;top:0;z-index:4;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:22px -8px 0;padding:10px 8px;background:rgba(10,10,15,0.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .chip{display:inline-flex;align-items:baseline;gap:6px;padding:5px 11px;border:1px solid var(--border-strong);border-radius:999px;background:transparent;cursor:pointer;font-size:0.82rem;color:var(--fg-dim);white-space:nowrap}
  .chip span{font-family:var(--font-mono);font-size:0.7rem;color:var(--fg-dimmer)}
  .chip:hover{color:var(--fg);border-color:var(--fg-dimmer)}
  .chip[aria-expanded="true"]{color:var(--fg);border-color:var(--pink-line);background:var(--pink-soft)}
  .chip.cur::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--pink);align-self:center}
  .all{margin-left:auto;padding:5px 2px;border:0;background:transparent;cursor:pointer;font-size:0.8rem;color:var(--fg-dimmer);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
  .all:hover{color:var(--fg)}
  .cat{border-bottom:1px solid var(--border);scroll-margin-top:64px}
  .cat>summary{list-style:none;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto 14px;align-items:baseline;gap:4px 14px;padding:18px 4px 16px;cursor:pointer;user-select:none}
  .cat>summary::-webkit-details-marker{display:none}
  .cat-t{font-family:var(--font-display);font-size:1.4rem;font-weight:600;letter-spacing:-0.01em;color:var(--cream);transition:color .15s}
  .cat>summary:hover .cat-t{color:var(--pink-2)}
  .cat-n{font-family:var(--font-mono);font-size:0.76rem;color:var(--pink)}
  .cat-sub{font-size:0.86rem;color:var(--fg-dimmer);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cat-on{font-size:0.7rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--pink);white-space:nowrap}
  .chev{align-self:center;width:8px;height:8px;margin-top:-4px;border-right:1.5px solid var(--fg-dim);border-bottom:1.5px solid var(--fg-dim);transform:rotate(45deg);transition:transform .2s}
  .cat[open] .chev{transform:rotate(-135deg);margin-top:4px}
  .cat>.grid{padding:2px 0 28px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:14px}

  .card{position:relative;min-width:0;display:flex;flex-direction:column;background:#111118;border:1px solid var(--border);border-radius:4px;cursor:pointer;transition:border-color .15s,background .15s}
  .card:hover{border-color:var(--border-strong);background:#14141c}
  .card input{position:absolute;opacity:0;pointer-events:none}
  .card:has(input:focus-visible){outline:2px solid var(--pink-2);outline-offset:2px}
  .card:has(input:checked){border-color:var(--pink);background:#1a121a;box-shadow:0 0 0 1px var(--pink)}
  .pv{padding:2px 10px;pointer-events:none;min-height:120px;flex:1;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
  .pv img{max-width:100%;max-height:60vh}
  .card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px 10px;border-top:1px solid var(--border)}
  .nm{font-weight:600;font-size:0.92rem}
  .note{font-size:0.72rem;color:var(--fg-dimmer);margin-left:6px;font-weight:400}
  .on{font-size:0.72rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--pink);visibility:hidden}
  .card:has(input:checked) .on{visibility:visible}

  .panel{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;background:var(--bg-card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:4px;padding:24px 24px 26px;scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
  .panel section+section{margin-top:30px;padding-top:24px;border-top:1px solid var(--border)}
  .chosen{margin:10px 0 0;font-size:0.9rem;color:var(--fg-dim)}
  .chosen b{color:var(--fg)}
  .hint{margin:8px 0 10px;font-size:0.86rem;color:var(--fg-dim)}
  label.lbl{display:block;font-size:0.76rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-dimmer);margin:14px 0 6px}
  textarea{width:100%;min-height:150px;resize:vertical;background:#08080c;color:var(--fg);border:1px solid var(--border-strong);border-radius:3px;padding:10px 12px;font:12.5px/1.5 var(--font-mono);caret-color:var(--pink)}
  textarea::placeholder{color:var(--fg-dimmer)}
  textarea[readonly]{background:#0d0d13}
  textarea:focus{outline:none;border-color:var(--pink-line)}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
  .btn{padding:9px 16px;border-radius:2px;border:1px solid var(--border-strong);background:rgba(255,255,255,0.03);cursor:pointer;font-size:0.88rem;font-weight:600}
  .btn:hover{border-color:var(--fg-dimmer)}
  .btn.primary{background:var(--pink);border-color:var(--pink);color:#0a0a0f}
  .btn.primary:hover{background:var(--pink-2);border-color:var(--pink-2)}
  .btn:disabled{opacity:.45;cursor:default}
  .status{font-size:0.84rem;color:var(--fg-dim);margin:8px 0 0;min-height:1.3em}
  .status.ok{color:var(--green)} .status.err{color:var(--yellow)}
  .short{display:block;margin-top:6px;padding:9px 11px;background:#08080c;border:1px solid var(--border);border-radius:3px;font:12px/1.5 var(--font-mono);color:var(--fg-dim);word-break:break-all;user-select:all}
  .steps{margin:14px 0 0;padding-left:20px;color:var(--fg-dim);font-size:0.88rem}
  .steps li{margin-bottom:8px;padding-left:4px}
  .steps li::marker{color:var(--pink);font-family:var(--font-mono);font-size:0.8rem}
  .steps b{color:var(--fg);font-weight:600}
  .aside-note{margin-top:14px;padding:12px 14px;border:1px solid var(--border);border-radius:3px;font-size:0.84rem;color:var(--fg-dim)}
  .aside-note b{color:var(--fg)}

  .jump{display:none}
  @media (max-width:980px){
    .layout{grid-template-columns:1fr}
    .panel{position:static;max-height:none}
    .jump{display:flex;position:fixed;left:16px;right:16px;bottom:14px;z-index:5;justify-content:space-between;align-items:center;gap:10px;padding:11px 16px;background:#1a121af2;border:1px solid var(--pink);border-radius:3px;color:var(--fg);font-size:0.9rem;box-shadow:0 8px 24px #0009}
    .jump[hidden]{display:none}
    .cats{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:18px -16px 0;padding:10px 16px}
    .cats::-webkit-scrollbar{display:none}
    .cat>summary{grid-template-columns:auto minmax(0,1fr) 14px;padding:16px 2px 14px}
    .cat-n{justify-self:start}
    .cat-sub{grid-column:1/3;grid-row:2;white-space:normal}
    .cat-on{grid-column:1/3;grid-row:3}
    .chev{grid-column:3;grid-row:1}
    .jump span:last-child{color:var(--pink-2);font-weight:600}
  }
  @media (max-width:520px){
    .top,.wrap{padding-left:16px;padding-right:16px}
    .grid{grid-template-columns:minmax(0,1fr)}
    .panel{padding:18px 16px 20px}
  }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./">★ SLAY Images</a>
  <div class="lang-toggle" role="group" aria-label="Language">
    <button class="lang-btn" data-lang="ru" aria-pressed="true">RU</button>
    <button class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
  </div>
</header>

<main class="wrap">
  <h1 class="title" data-i="title"></h1>
  <p class="lede" data-i="lede"></p>

  <div class="layout">
    <section class="pick" aria-labelledby="h-pick">
      <div class="pick-head">
        <h2 class="step-h" id="h-pick"><span class="n">01</span><span data-i="pickH"></span></h2>
        <div class="seg"><span data-i="sample"></span>
          <div class="seg-btns" role="group">
            <button data-img="images/anime3.jpg" aria-pressed="true" data-i="wide"></button>
            <button data-img="images/anime5.jpg" aria-pressed="false" data-i="tall"></button>
          </div>
        </div>
      </div>
      <nav class="cats" id="cats" aria-label="Categories"></nav>
      <div id="groups"></div>
    </section>

    <aside class="panel" id="panel" aria-label="Prompt">
      <section>
        <h2 class="step-h"><span class="n">02</span><span data-i="promptH"></span></h2>
        <p class="chosen" id="chosen"></p>
        <p class="hint" data-i="promptHint"></p>
        <label class="lbl" for="src" data-i="srcL"></label>
        <textarea id="src" spellcheck="false"></textarea>
        <div class="row"><button class="btn primary" id="go"></button></div>
        <p class="status" id="status" role="status"></p>
        <label class="lbl" for="out" data-i="outL"></label>
        <textarea id="out" readonly spellcheck="false"></textarea>
        <div class="row"><button class="btn" id="copy" disabled data-i="copy"></button></div>
        <label class="lbl" data-i="shortL"></label>
        <code class="short" id="short"></code>
      </section>
      <section>
        <h2 class="step-h"><span class="n">03</span><span data-i="stH"></span></h2>
        <div class="row"><button class="btn primary" id="dl"></button></div>
        <ol class="steps" id="steps"></ol>
        <div class="aside-note" data-i="hideNote" data-html></div>
        <div class="row"><button class="btn" id="dlhide" data-i="dlHide"></button></div>
      </section>
    </aside>
  </div>
</main>
<a class="jump" id="jump" href="#panel" hidden><span id="jumpName"></span><span data-i="jump"></span></a>

let lang='ru', cur='vhs', sample='images/anime3.jpg';
const $=s=>document.querySelector(s);
const byKey=Object.fromEntries(FRAMES.map(f=>[f.key,f]));
const toRe=s=>{const m=s.match(/^\/([\s\S]*)\/([a-z]*)$/);return new RegExp(m[1],m[2])};
const fname=f=>lang==='en'?f.nameEn:f.name;
const label=f=>fname(f)+(f.note[lang]?` (${f.note[lang]})`:'');

function sampleTag(f){
  const code=SlayFrames.shortCode(f.key).replace('Scene caption',T[lang].cap).replace('[SENDER NAME]','Alex');
  return code.replace(/<img[^>]*>/,`<img src="${sample}" alt="">`);
}
function renderPreview(f){
  const pv=document.querySelector(`[data-pv="${f.key}"]`);
  const r=f.regex; pv.innerHTML=sampleTag(f).replace(toRe(r.findRegex),r.replaceString); pv.dataset.done=sample;
}
const CATS=['y2k','social','sub','ru','screen','fashion','travel','crime','college','fantasy','scifi','paper','soft','min'];
const OKEY='slay-frames-open';
let openSet=null;
try{const v=JSON.parse(localStorage.getItem(OKEY)); if(Array.isArray(v)) openSet=new Set(v)}catch(e){}
if(!openSet) openSet=new Set([byKey[cur].group]);
const saveOpen=()=>{try{localStorage.setItem(OKEY,JSON.stringify([...openSet]))}catch(e){}};
function renderCat(d){ d.querySelectorAll('[data-pv]').forEach(pv=>{ if(pv.dataset.done!==sample) renderPreview(byKey[pv.dataset.pv]) }) }
function syncCats(){
  const cats=[...document.querySelectorAll('.cat')];
  for(const d of cats){
    const has=byKey[cur].group===d.dataset.cat;
    d.querySelector('.cat-on').textContent=has&&!d.open?T[lang].chosenOn+': '+label(byKey[cur]):'';
    const ch=document.querySelector(`.chip[data-cat="${d.dataset.cat}"]`);
    ch.setAttribute('aria-expanded',d.open); ch.classList.toggle('cur',has);
  }
  $('#all').textContent=cats.every(d=>d.open)?T[lang].closeAll:T[lang].openAll;
}
function buildGrid(){
  const g=$('#groups'), nav=$('#cats'); g.innerHTML=''; nav.innerHTML='';
  for(const ck of CATS){
    const list=FRAMES.filter(x=>x.group===ck), [title,sub]=T[lang].cats[ck];
    const d=document.createElement('details'); d.className='cat'; d.id='cat-'+ck; d.dataset.cat=ck;
    d.innerHTML=`<summary><span class="cat-t">${title}</span><span class="cat-n">${list.length}</span><span class="cat-sub">${sub}</span><span class="cat-on"></span><span class="chev" aria-hidden="true"></span></summary><div class="grid" role="radiogroup" aria-label="${title}"></div>`;
    const grid=d.querySelector('.grid');
    for(const f of list){
      const c=document.createElement('label'); c.className='card';
      c.innerHTML=`<input type="radio" name="frame" value="${f.key}"${f.key===cur?' checked':''}><div class="pv" data-pv="${f.key}"></div><div class="card-foot"><span class="nm">${fname(f)}<span class="note">${f.note[lang]}</span></span><span class="on">${T[lang].chosenOn}</span></div>`;
      grid.appendChild(c);
    }
    g.appendChild(d);
    d.open=openSet.has(ck); if(d.open) renderCat(d);
    d.addEventListener('toggle',()=>{ if(d.open){openSet.add(ck); renderCat(d)} else openSet.delete(ck); saveOpen(); syncCats() });
    const ch=document.createElement('button'); ch.type='button'; ch.className='chip'; ch.dataset.cat=ck; ch.setAttribute('aria-controls','cat-'+ck);
    ch.innerHTML=`${title}<span>${list.length}</span>`;
    ch.addEventListener('click',()=>{ d.open=true; d.scrollIntoView({behavior:'smooth',block:'start'}) });
    nav.appendChild(ch);
  }
  const all=document.createElement('button'); all.type='button'; all.className='all'; all.id='all';
  all.addEventListener('click',()=>{ const cats=[...document.querySelectorAll('.cat')], open=!cats.every(d=>d.open); cats.forEach(d=>d.open=open) });
  nav.appendChild(all);
  syncCats();
}
function setStatus(t,cls){const s=$('#status');s.textContent=t;s.className='status'+(cls?' '+cls:'')}
function run(){
  const src=$('#src').value;
  if(!src.trim()){ $('#out').value=''; $('#copy').disabled=true; setStatus(T[lang].empty,'err'); return }
  const r=SlayFrames.convert(src,cur);
  if(!r.ok){ $('#out').value=''; $('#copy').disabled=true; setStatus(T[lang].none,'err'); return }
  $('#out').value=r.text; $('#copy').disabled=false;
  const cap=(r.text.match(/\bcap="([^"]*)"/)||[])[1]||'';
  setStatus(T[lang].done(r.count,cap),'ok');
}
function syncFrame(){
  const f=byKey[cur], n=label(f);
  $('#go').textContent=T[lang].go(n); $('#dl').textContent=T[lang].dl(n);
  $('#chosen').innerHTML=T[lang].chosen(n); $('#jumpName').textContent=n;
  $('#short').textContent=SlayFrames.shortCode(cur);
  if($('#out').value) run();
}
function applyLang(){
  document.documentElement.lang=lang; document.title=lang==='en'?'SLAY Images — Frames':'SLAY Images — Рамки';
  document.querySelectorAll('[data-i]').forEach(el=>{const v=T[lang][el.dataset.i]; if(typeof v==='string') el.innerHTML=v});
  document.querySelectorAll('.lang-btn').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
  $('#steps').innerHTML=T[lang].steps.map(s=>`<li>${s}</li>`).join('');
  $('#src').placeholder='<div style="…">\n  <img data-iig-instruction=\'{"style":"…","prompt":"…"}\' src="[IMG:GEN]">\n  <div><i>Scene caption</i></div>\n</div>';
  buildGrid(); syncFrame();
  if($('#status').textContent) run();
}
function download(obj,name){
  const b=new Blob([JSON.stringify(obj,null,4)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);
}
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

$('#groups').addEventListener('change',e=>{ if(e.target.name==='frame'){cur=e.target.value; syncFrame(); syncCats()} });
document.querySelectorAll('.lang-btn').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang; applyLang()}));
document.querySelectorAll('.seg-btns button').forEach(b=>b.addEventListener('click',()=>{
  sample=b.dataset.img; document.querySelectorAll('.seg-btns button').forEach(x=>x.setAttribute('aria-pressed',x===b)); document.querySelectorAll('.cat[open]').forEach(renderCat)}));
$('#go').addEventListener('click',run);
$('#copy').addEventListener('click',async()=>{
  const o=$('#out'); try{await navigator.clipboard.writeText(o.value)}catch(e){o.select();document.execCommand('copy')}
  const b=$('#copy'); b.textContent=T[lang].copied; setTimeout(()=>b.textContent=T[lang].copy,1400);
});
$('#dl').addEventListener('click',()=>{const f=byKey[cur]; download(f.regex,`ramki-${slug(f.name+(f.note.en?'-'+f.note.en:''))}.json`)});
$('#dlhide').addEventListener('click',()=>download(HIDE,'ramki-hide-from-ai.json'));
const panel=$('#panel'), jump=$('#jump');
if('IntersectionObserver' in window) new IntersectionObserver(es=>{jump.hidden=es[0].isIntersecting}).observe(panel);
applyLang();
</script>
</body>
</html>
